version: '3.8'

services:
  samudra-web:
    build:
      context: .
      cache_from:
        - samudra-web:latest
    ports:
      - "${PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/images:/usr/share/nginx/html/images:ro
    restart: unless-stopped
