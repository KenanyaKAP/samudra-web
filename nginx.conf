server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve public images and static files
    location /images/ {
        alias /usr/share/nginx/html/images/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # No caching for JSON data files
    location ~* ^/data/.*\.json$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Serve static assets (fonts only) with caching
    location ~* \.(?:css|js|woff2?|woff|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Try files, and fall back to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: small security headers for static site
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";
}
