# Explicit project name: this machine already has "samudra-web_*" volumes
# from an earlier install, and the default (the folder name) would reuse them.
name: samudra-react

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3310:3306"
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  wordpress:
    image: wordpress:6.4-apache
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # WP_DEBUG comes from here, not from WORDPRESS_CONFIG_EXTRA: defining it
      # twice makes every CLI bootstrap (wp:reseed, wp:seed-demo) warn.
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://' . ($$_SERVER['HTTP_HOST'] ?? 'localhost:4600') );
        define( 'WP_SITEURL', 'http://' . ($$_SERVER['HTTP_HOST'] ?? 'localhost:4600') );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wordpress_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/samudra-react
    ports:
      - "4600:80"
    networks:
      - wordpress_network
    restart: unless-stopped

volumes:
  db_data:
  wordpress_data:

networks:
  wordpress_network:
    driver: bridge
